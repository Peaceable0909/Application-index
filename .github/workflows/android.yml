# Builds the signed Android release (AAB for Google Play, APK for testing) on demand.
# Actions, Android app, Run workflow. Needs four repository secrets (Settings, Secrets and variables, Actions):
#   ANDROID_KEYSTORE_BASE64     the upload keystore file, base64 encoded (base64 -w0 upload.keystore)
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           upload
#   ANDROID_KEY_PASSWORD        the key password (the same as the keystore password for a PKCS12 file)
name: Android app
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode, a whole number higher than the last release on Google Play'
        required: true
      version_name:
        description: 'versionName people see, for example 1.0.1'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Write the upload key
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: whiterock-android-${{ inputs.version_name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
